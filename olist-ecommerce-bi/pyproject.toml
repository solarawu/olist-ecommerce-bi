[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "olist-ecommerce-bi"
version = "0.1.0"
description = "An end-to-end business intelligence project built on DuckDB + Streamlit: from raw CSV to a star schema warehouse, metrics layer, and interactive dashboard for Olist's 100k-brazilian-orders dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "黑河学院 · 数据科学与大数据技术" },
]
keywords = ["duckdb", "streamlit", "sql", "bi", "data-analyst", "data-warehouse", "olist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
]

[project.urls]
Repository = "https://github.com/solarawu/olist-ecommerce-bi"
Issues = "https://github.com/solarawu/olist-ecommerce-bi/issues"

[project.scripts]
olist-download    = "src.download:download"
olist-build       = "src.build_warehouse:build"
olist-metrics     = "src.run_metrics:run"
olist-quality     = "src.quality_check:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
